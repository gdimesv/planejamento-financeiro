<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planejamento Financeiro</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="page">
    <p class="eyebrow">Planejamento Financeiro</p>
    <h1>Clientes</h1>

    {% for cliente in clientes %}
    <div class="card">
      <h2>{{ cliente.id }}</h2>
      <p class="nav-links"><a href="/objetivos/{{ cliente.id }}">Objetivos</a></p>
      <ul class="month-list">
        {% for mes in cliente.meses %}
        <li>
          <a href="/setup/{{ cliente.id }}/{{ mes }}">Setup {{ mes }}</a>
          &middot;
          <a href="/report/{{ cliente.id }}/{{ mes }}" target="_blank" rel="noopener">relatório</a>
        </li>
        {% else %}
        <li>Nenhum mês ainda.</li>
        {% endfor %}
      </ul>
      <div class="new-month">
        <input type="month" id="new-month-{{ cliente.id }}" aria-label="Novo mês para {{ cliente.id }}">
        <button type="button" onclick="irParaSetup('{{ cliente.id }}')">Iniciar setup do mês</button>
      </div>
    </div>
    {% else %}
    <p>Nenhum cliente encontrado em <code>clientes/</code>.</p>
    {% endfor %}
  </div>
  <script>
    function irParaSetup(clienteId) {
      var input = document.getElementById('new-month-' + clienteId);
      if (!input.value) return;
      window.location.href = '/setup/' + clienteId + '/' + input.value;
    }
  </script>
</body>
</html>
